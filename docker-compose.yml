version: '3.9'

# ------------------------------------------------------------------------------
# Shared environment for all Python services (app, celery_worker, celery_beat).
# Individual services may still override specific variables below.
# ------------------------------------------------------------------------------
x-app-env: &app-env
  SECRET_KEY: ${SECRET_KEY}
  DEBUG: 1
  DB_HOST: db
  DB_NAME: dev_db
  DB_USER: devuser
  DB_PASS: changeme
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
  CORS_ALLOWED_ORIGINS: http://localhost:5173 http://127.0.0.1:5173
  ALLOWED_HOSTS: 127.0.0.1 localhost

services:
  app:
    build:
      context: .
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8080"
    ports:
      - 8080:8080
    volumes:
      - ./app:/app
      - ./data/web:/vol/web
    environment:
      <<: *app-env
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: .
    command: sh -c "python manage.py wait_for_db && celery -A app worker --loglevel=info"
    volumes:
      - ./app:/app
    environment:
      <<: *app-env
    depends_on:
      - db
      - redis

  celery_beat:
    build:
      context: .
    command: >
      sh -c "python manage.py wait_for_db &&
             celery -A app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    volumes:
      - ./app:/app
    environment:
      <<: *app-env
    depends_on:
      - db
      - redis

  db:
    image: postgres:13-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=dev_db
      - POSTGRES_USER=devuser
      - POSTGRES_PASSWORD=changeme
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
